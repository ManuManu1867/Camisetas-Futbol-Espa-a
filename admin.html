<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Tienda</title>
    <style>
        :root {
            --primary: #111827;
            --accent: #2563eb;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #111827;
            --border: #e5e7eb;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { margin-bottom: 20px; font-size: 1.8rem; text-align: center; }
        
        .card { background: var(--surface); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); }
        .card h2 { margin-bottom: 15px; font-size: 1.2rem; color: var(--accent); border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }
        
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn:hover { background: var(--accent); }
        .mensaje { margin-top: 10px; font-weight: 600; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Panel de Control 🛠️</h1>

        <!-- Añadir Camiseta -->
        <div class="card">
            <h2>➕ Añadir Nueva Camiseta</h2>
            <form id="formCamiseta" onsubmit="enviarFormulario(event, 'camisetas')">
                <div class="form-group">
                    <label>Título del producto:</label>
                    <input type="text" id="c_titulo" placeholder="Ej: Camiseta Local Real Madrid 2026" required>
                </div>
                <div class="form-group">
                    <label>Categoría:</label>
                    <select id="c_categoria">
                        <option value="Selecciones">Selecciones</option>
                        <option value="Clubes">Clubes</option>
                        <option value="Retro">Retro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Precio (€):</label>
                    <input type="number" step="0.01" id="c_precio" placeholder="25.00" required>
                </div>
                <div class="form-group">
                    <label>URL de las imágenes (separadas por comas si son varias):</label>
                    <textarea id="c_imagenes" rows="2" placeholder="https://enlace1.com/img.jpg, https://enlace2.com/img.jpg" required></textarea>
                </div>
                <div class="form-group">
                    <label>Tallas disponibles (separadas por comas):</label>
                    <input type="text" id="c_talla" value="S, M, L, XL, XXL" required>
                </div>
                <button type="submit" class="btn">Guardar Camiseta en Google Sheets</button>
                <div id="msg-camisetas" class="mensaje"></div>
            </form>
        </div>

        <!-- Añadir Parche -->
        <div class="card">
            <h2>➕ Añadir Nuevo Parche</h2>
            <form id="formParche" onsubmit="enviarFormulario(event, 'parches')">
                <div class="form-group">
                    <label>ID único (Opcional, se genera solo si lo dejas en blanco):</label>
                    <input type="text" id="p_id" placeholder="Ej: parche_champions">
                </div>
                <div class="form-group">
                    <label>Nombre del Parche:</label>
                    <input type="text" id="p_nombre" placeholder="Ej: Parche Champions League" required>
                </div>
                <div class="form-group">
                    <label>Posición:</label>
                    <select id="p_posicion">
                        <option value="Centro">Centro del Pecho (C)</option>
                        <option value="Izquierdo">Hombro Izquierdo (I)</option>
                        <option value="Derecho">Hombro Derecho (D)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>URL de la imagen del parche:</label>
                    <input type="text" id="p_imagen" placeholder="https://enlace.com/parche.png" required>
                </div>
                <button type="submit" class="btn" style="background: #059669;">Guardar Parche en Google Sheets</button>
                <div id="msg-parches" class="mensaje"></div>
            </form>
        </div>
    </div>

    <script>
        // NUEVA URL DE GOOGLE APPS SCRIPT
        const API_URL = 'https://script.google.com/macros/s/AKfycbxVdpVaulwpjHZyKKPBtfN0XC_FNhZxYftW3fCqXd0JeYEASagt4duknAa0mA60uIYf8g/exec';

        async function enviarFormulario(event, tipo) {
            event.preventDefault();
            let msgDiv = document.getElementById(tipo === 'camisetas' ? 'msg-camisetas' : 'msg-parches');
            msgDiv.style.color = '#2563eb';
            msgDiv.innerText = "Guardando en Google Sheets...";

            let datos = { tipo: tipo };

            if (tipo === 'camisetas') {
                datos.titulo = document.getElementById('c_titulo').value;
                datos.categoria = document.getElementById('c_categoria').value;
                datos.precio = document.getElementById('c_precio').value;
                datos.imagenes = document.getElementById('c_imagenes').value;
                datos.talla = document.getElementById('c_talla').value;
            } else {
                datos.id = document.getElementById('p_id').value;
                datos.nombre = document.getElementById('p_nombre').value;
                datos.posicion = document.getElementById('p_posicion').value;
                datos.imagen = document.getElementById('p_imagen').value;
            }

            try {
                let response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(datos)
                });
                let resultado = await response.json();

                if (resultado.success) {
                    msgDiv.style.color = 'var(--success)';
                    msgDiv.innerText = "¡Guardado con éxito en Google Sheets! ✅";
                    event.target.reset();
                } else {
                    throw new Error(resultado.error || "Error desconocido");
                }
            } catch (error) {
                msgDiv.style.color = '#ef4444';
                msgDiv.innerText = "Error al guardar: " + error.message;
            }
        }
    </script>
</body>
</html>
