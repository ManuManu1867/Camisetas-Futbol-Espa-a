<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Gestión de Catálogo</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --success-hover: #15803d;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 30px 20px; }

        header {
            max-width: 1200px; margin: 0 auto 25px auto; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap;
            gap: 20px; background: var(--surface); padding: 20px 30px;
            border-radius: var(--radius); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .header-brand { display: flex; align-items: center; gap: 20px; }
        .logo-container { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; }
        .logo-img { width: 100%; height: 100%; object-fit: contain; }

        .btn-cambiar-logo {
            background-color: #f1f5f9; color: var(--text); border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
        }

        .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .select-filtro { padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: var(--surface); cursor: pointer; }
        .btn-principal { background-color: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-publicar { background-color: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-editar { background-color: var(--warning); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000;
            justify-content: center; align-items: center; padding: 20px;
        }

        .modal-content {
            background-color: var(--surface); width: 100%; max-width: 550px;
            border-radius: var(--radius); padding: 25px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            max-height: 90vh; overflow-y: auto;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-cerrar { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }

        .preview-reorder-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding: 10px; background: #f8fafc; border: 1px dashed var(--border); border-radius: 8px; min-height: 105px; }
        .item-reorder { position: relative; width: 95px; height: 95px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: #fff; display: flex; flex-direction: column; align-items: center; }
        .item-reorder img { width: 100%; height: 65px; object-fit: cover; }
        .item-reorder-controls { display: flex; width: 100%; height: 30px; background: #e2e8f0; justify-content: space-between; align-items: center; padding: 0 4px; }
        .btn-sort { background: none; border: none; cursor: pointer; font-size: 0.75rem; font-weight: bold; padding: 2px 4px; color: #334155; }

        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .tarjeta { background-color: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .visor-imagen { position: relative; background-color: #f1f5f9; height: 320px; display: flex; align-items: center; justify-content: center; }
        .visor-imagen img.img-principal { width: 100%; height: 100%; object-fit: contain; padding: 15px; }
        .categoria-badge { position: absolute; top: 12px; left: 12px; background-color: rgba(15, 23, 42, 0.85); color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .miniaturas { display: flex; gap: 8px; padding: 10px 15px 0 15px; overflow-x: auto; justify-content: center; }
        .miniatura { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; cursor: pointer; border: 2px solid transparent; background-color: #f1f5f9; }
        .miniatura.activa { border-color: var(--primary); }
        .tarjeta-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; text-align: center; }
        .precio { font-size: 1.2rem; font-weight: 700; color: #16a34a; margin-bottom: 4px; }
        .talla { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; }
        .card-actions { display: flex; gap: 6px; justify-content: center; margin-top: auto; flex-wrap: wrap; }
        .btn-eliminar { background-color: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <div class="logo-container" id="logoContainer">
                <h2>Panel Admin</h2>
            </div>
        </div>

        <div class="actions">
            <input type="file" id="inputLogo" accept="image/*" style="display: none;" onchange="subirLogo(event)">
            <button class="btn-cambiar-logo" onclick="document.getElementById('inputLogo').click()">🖼️ Cambiar Logo</button>

            <select id="filtroCategoria" class="select-filtro" onchange="filtrarProductos()">
                <option value="todas">Todas las categorías</option>
                <option value="Selecciones">Selecciones</option>
                <option value="Clubes">Clubes</option>
                <option value="Retro">Retro</option>
                <option value="Otros">Otros</option>
            </select>

            <button class="btn-principal" onclick="abrirModalCrear()">+ Crear Camiseta</button>
            <button class="btn-publicar" onclick="publicarAlFrontend()">🚀 Lanzar a Tienda</button>
        </div>
    </header>

    <div class="modal" id="modalForm">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalFormTitulo">Añadir Camiseta a Borradores</h2>
                <button class="btn-cerrar" onclick="cerrarModal()">&times;</button>
            </div>
            <form id="formCamiseta">
                <input type="hidden" id="editProductoId" value="">

                <div class="form-group">
                    <label for="titulo">Nombre del Producto:</label>
                    <input type="text" id="titulo" required placeholder="Ej: España 1ra Equipación 2026">
                </div>
                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" required>
                        <option value="Selecciones">Selecciones</option>
                        <option value="Clubes">Clubes</option>
                        <option value="Retro">Retro</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="precio">Precio Base (€):</label>
                    <input type="number" step="0.01" id="precio" required placeholder="Ej: 25">
                </div>
                <div class="form-group">
                    <label for="talla">Tallas disponibles:</label>
                    <input type="text" id="talla" required placeholder="Ej: S, M, L, XL">
                </div>
                <div class="form-group">
                    <label for="imagenes">Imágenes (Las fotos se optimizan solas):</label>
                    <input type="file" id="imagenes" accept="image/*" multiple onchange="cargarPreviaImagenes(event)">
                    <div class="preview-reorder-container" id="reorderContainer"></div>
                </div>
                <button type="submit" class="btn-principal" style="width: 100%;">Guardar Producto</button>
            </form>
        </div>
    </div>

    <div class="catalogo" id="catalogo"></div>

    <script>
        const form = document.getElementById('formCamiseta');
        const catalogo = document.getElementById('catalogo');
        const modal = document.getElementById('modalForm');

        const DRAFTS_KEY = 'camisetas_drafts';
        const PUBLIC_KEY = 'camisetas_public';
        const LOGO_DRAFT_KEY = 'logo_draft';
        const LOGO_PUBLIC_KEY = 'logo_public';

        let imagenesTemporal = [];

        document.addEventListener('DOMContentLoaded', () => {
            cargarLogo();
            cargarProductos();
        });

        function comprimirImagen(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        const scaleFactor = MAX_WIDTH / img.width;
                        canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
                        canvas.height = (img.width > MAX_WIDTH) ? img.height * scaleFactor : img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        function subirLogo(event) {
            const file = event.target.files[0];
            if (file) {
                comprimirImagen(file).then(base64Logo => {
                    localStorage.setItem(LOGO_DRAFT_KEY, base64Logo);
                    renderizarLogo(base64Logo);
                });
            }
        }

        function cargarLogo() {
            const logoGuardado = localStorage.getItem(LOGO_DRAFT_KEY);
            if (logoGuardado) renderizarLogo(logoGuardado);
        }

        function renderizarLogo(src) {
            document.getElementById('logoContainer').innerHTML = `<img src="${src}" class="logo-img">`;
        }

        async function cargarPreviaImagenes(event) {
            const archivos = Array.from(event.target.files);
            const nuevasBase64 = await Promise.all(archivos.map(file => comprimirImagen(file)));
            imagenesTemporal = [...imagenesTemporal, ...nuevasBase64];
            renderizarPreviaReordenar();
            document.getElementById('imagenes').value = ''; 
        }

        function renderizarPreviaReordenar() {
            const container = document.getElementById('reorderContainer');
            container.innerHTML = '';
            imagenesTemporal.forEach((src, index) => {
                const div = document.createElement('div');
                div.className = 'item-reorder';
                div.innerHTML = `
                    <img src="${src}">
                    <div class="item-reorder-controls">
                        <button type="button" class="btn-sort" onclick="moverFoto(${index}, -1)">⬅️</button>
                        <button type="button" class="btn-sort" style="color:red" onclick="borrarFoto(${index})">🗑️</button>
                        <button type="button" class="btn-sort" onclick="moverFoto(${index}, 1)">➡️</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function moverFoto(index, direccion) {
            const nuevoIndice = index + direccion;
            if (nuevoIndice < 0 || nuevoIndice >= imagenesTemporal.length) return;
            const temp = imagenesTemporal[index];
            imagenesTemporal[index] = imagenesTemporal[nuevoIndice];
            imagenesTemporal[nuevoIndice] = temp;
            renderizarPreviaReordenar();
        }

        function borrarFoto(index) {
            imagenesTemporal.splice(index, 1);
            renderizarPreviaReordenar();
        }

        function abrirModalCrear() { 
            document.getElementById('modalFormTitulo').innerText = 'Añadir Camiseta a Borradores';
            document.getElementById('editProductoId').value = '';
            form.reset();
            imagenesTemporal = [];
            document.getElementById('reorderContainer').innerHTML = '';
            modal.style.display = 'flex'; 
        }

        function abrirModalEditar(id) {
            let productos = JSON.parse(localStorage.getItem(DRAFTS_KEY)) || [];
            const producto = productos.find(p => p.id === id);
            if (!producto) return;

            document.getElementById('modalFormTitulo').innerText = '✏️ Editar Producto';
            document.getElementById('editProductoId').value = producto.id;
            document.getElementById('titulo').value = producto.titulo;
            document.getElementById('categoria').value = producto.categoria;
            document.getElementById('precio').value = producto.precio;
            document.getElementById('talla').value = producto.talla;

            imagenesTemporal = [...producto.imagenes];
            renderizarPreviaReordenar();
            modal.style.display = 'flex';
        }

        function cerrarModal() { modal.style.display = 'none'; }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (imagenesTemporal.length === 0) {
                alert('Añade al menos una imagen.');
                return;
            }

            const editId = document.getElementById('editProductoId').value;
            const productoData = {
                id: editId ? parseInt(editId) : Date.now(),
                titulo: document.getElementById('titulo').value.trim(),
                categoria: document.getElementById('categoria').value,
                precio: parseFloat(document.getElementById('precio').value).toFixed(2),
                talla: document.getElementById('talla').value.trim(),
                imagenes: imagenesTemporal
            };

            try {
                let productos = JSON.parse(localStorage.getItem(DRAFTS_KEY)) || [];
                if (editId) {
                    const idx = productos.findIndex(p => p.id === productoData.id);
                    if (idx !== -1) productos[idx] = productoData;
                } else {
                    productos.push(productoData);
                }
                localStorage.setItem(DRAFTS_KEY, JSON.stringify(productos));
                cargarProductos();
                cerrarModal();
            } catch (err) {
                alert("⚠️ Se ha alcanzado la memoria máxima. Prueba a borrar alguna camiseta previa.");
            }
        });

        function cargarProductos() {
            catalogo.innerHTML = '';
            let productos = JSON.parse(localStorage.getItem(DRAFTS_KEY)) || [];
            productos.forEach(producto => renderizarProducto(producto));
        }

        function renderizarProducto(producto) {
            const tarjeta = document.createElement('div');
            tarjeta.classList.add('tarjeta');
            tarjeta.setAttribute('data-id', producto.id);
            tarjeta.setAttribute('data-categoria', producto.categoria);

            let miniaturasHTML = '';
            if (producto.imagenes.length > 1) {
                miniaturasHTML = `<div class="miniaturas">`;
                producto.imagenes.forEach((imgSrc, index) => {
                    miniaturasHTML += `<img src="${imgSrc}" class="miniatura ${index === 0 ? 'activa' : ''}" onclick="cambiarImagenPrincipal(${producto.id}, '${imgSrc}', this)">`;
                });
                miniaturasHTML += `</div>`;
            }

            tarjeta.innerHTML = `
                <div class="visor-imagen">
                    <span class="categoria-badge">${producto.categoria}</span>
                    <img src="${producto.imagenes[0]}" class="img-principal" id="img-main-${producto.id}">
                </div>
                ${miniaturasHTML}
                <div class="tarjeta-info">
                    <h3>${producto.titulo}</h3>
                    <div class="precio">${producto.precio} €</div>
                    <div class="talla">Tallas: ${producto.talla}</div>
                    <div class="card-actions">
                        <button class="btn-editar" onclick="abrirModalEditar(${producto.id})">✏️ Editar</button>
                        <button class="btn-eliminar" onclick="eliminarProducto(${producto.id})">Eliminar</button>
                    </div>
                </div>
            `;
            catalogo.appendChild(tarjeta);
        }

        function cambiarImagenPrincipal(id, nuevaSrc, elementoThumb) {
            document.getElementById(`img-main-${id}`).src = nuevaSrc;
            const tarjeta = elementoThumb.closest('.tarjeta');
            tarjeta.querySelectorAll('.miniatura').forEach(thumb => thumb.classList.remove('activa'));
            elementoThumb.classList.add('activa');
        }

        function eliminarProducto(id) {
            if(!confirm('¿Eliminar producto?')) return;
            let productos = JSON.parse(localStorage.getItem(DRAFTS_KEY)) || [];
            productos = productos.filter(p => p.id !== id);
            localStorage.setItem(DRAFTS_KEY, JSON.stringify(productos));
            cargarProductos();
        }

        function filtrarProductos() {
            const cat = document.getElementById('filtroCategoria').value;
            document.querySelectorAll('.tarjeta').forEach(tarjeta => {
                const c = tarjeta.getAttribute('data-categoria');
                tarjeta.style.display = (cat === 'todas' || c === cat) ? 'flex' : 'none';
            });
        }

        function publicarAlFrontend() {
            try {
                const borradores = localStorage.getItem(DRAFTS_KEY) || '[]';
                localStorage.setItem(PUBLIC_KEY, borradores);
                const logoDraft = localStorage.getItem(LOGO_DRAFT_KEY);
                if (logoDraft) localStorage.setItem(LOGO_PUBLIC_KEY, logoDraft);
                alert('🚀 ¡Lanzamiento completado! Tu web oficial ya está actualizada.');
            } catch(e) {
                alert("⚠️ Error al publicar: excede el tamaño límite.");
            }
        }
    </script>
</body>
</html>
