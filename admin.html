<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Tienda</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .tabs { display: flex; justify-content: center; margin-bottom: 25px; border-bottom: 2px solid #ecf0f1; flex-wrap: wrap; }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; font-weight: bold; color: #7f8c8d; transition: 0.3s; }
        .tab-btn.active { color: #3498db; border-bottom: 3px solid #3498db; margin-bottom: -2px; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button.submit-btn { background: #2ecc71; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.2s; }
        button.submit-btn:hover { background: #27ae60; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Panel de Gestión</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'camiseta')">Camisetas</button>
            <button class="tab-btn" onclick="switchTab(event, 'parche')">Parches</button>
            <button class="tab-btn" onclick="switchTab(event, 'edicion')">Ediciones</button>
            <button class="tab-btn" onclick="switchTab(event, 'otro')">Otros</button>
        </div>

        <!-- Formulario Camisetas -->
        <form id="form-camiseta" class="form-section active" onsubmit="enviarFormulario(event, 'camiseta')">
            <h3>Añadir Camiseta</h3>
            <div class="form-group">
                <label>Nombre del producto:</label>
                <input type="text" name="nombre" required placeholder="Ej: Camiseta Local Real Madrid 2026">
            </div>
            <div class="form-group">
                <label>Precio (€):</label>
                <input type="number" step="0.01" name="precio" required placeholder="25.00">
            </div>
            <div class="form-group">
                <label>URL de la Imagen:</label>
                <input type="url" name="imagen" required placeholder="https://ejemplo.com/imagen.jpg">
            </div>
            <div class="form-group">
                <label>Categoría / Liga:</label>
                <input type="text" name="categoria" placeholder="Ej: LaLiga, Premier League">
            </div>
            <div class="form-group">
                <label>Tallas disponibles (separadas por comas):</label>
                <input type="text" name="tallas" value="S, M, L, XL, XXL" required>
            </div>
            <div class="form-group">
                <label>Parches Permitidos (IDs o nombres separados por comas):</label>
                <input type="text" name="parchesPermitidos" placeholder="Ej: Champions, LaLiga">
            </div>
            <button type="submit" class="submit-btn">Guardar Camiseta</button>
        </form>

        <!-- Formulario Parches -->
        <form id="form-parche" class="form-section" onsubmit="enviarFormulario(event, 'parche')">
            <h3>Añadir Parche</h3>
            <div class="form-group">
                <label>Nombre del Parche:</label>
                <input type="text" name="nombre" required placeholder="Ej: Parche Champions League">
            </div>
            <div class="form-group">
                <label>Precio (€):</label>
                <input type="number" step="0.01" name="precio" required placeholder="3.00">
            </div>
            <div class="form-group">
                <label>URL de la Imagen:</label>
                <input type="url" name="imagen" required placeholder="https://ejemplo.com/parche.jpg">
            </div>
            <button type="submit" class="submit-btn">Guardar Parche</button>
        </form>

        <!-- Formulario Ediciones -->
        <form id="form-edicion" class="form-section" onsubmit="enviarFormulario(event, 'edicion')">
            <h3>Añadir Edición Especial</h3>
            <div class="form-group">
                <label>Nombre de la Edición:</label>
                <input type="text" name="nombre" required placeholder="Ej: Retro 1998 Coleccionista">
            </div>
            <div class="form-group">
                <label>Precio (€):</label>
                <input type="number" step="0.01" name="precio" required placeholder="35.00">
            </div>
            <div class="form-group">
                <label>URL de la Imagen:</label>
                <input type="url" name="imagen" required placeholder="https://ejemplo.com/edicion.jpg">
            </div>
            <div class="form-group">
                <label>Descripción:</label>
                <textarea name="descripcion" rows="3" placeholder="Detalles de la edición especial..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Guardar Edición</button>
        </form>

        <!-- Formulario Otros -->
        <form id="form-otro" class="form-section" onsubmit="enviarFormulario(event, 'otro')">
            <h3>Añadir Otro Producto</h3>
            <div class="form-group">
                <label>Nombre del Producto:</label>
                <input type="text" name="nombre" required placeholder="Ej: Bufanda Oficial">
            </div>
            <div class="form-group">
                <label>Precio (€):</label>
                <input type="number" step="0.01" name="precio" required placeholder="12.00">
            </div>
            <div class="form-group">
                <label>URL de la Imagen:</label>
                <input type="url" name="imagen" required placeholder="https://ejemplo.com/otro.jpg">
            </div>
            <button type="submit" class="submit-btn">Guardar Producto</button>
        </form>

        <div id="mensaje"></div>
    </div>

    <script>
        // URL de tu Apps Script implementada correctamente
        const API_URL = "https://script.google.com/macros/s/AKfycbxuCoFYrTe_q0rTwMhDr_OXaeW76ir0sHx10eY1fNnnAXAcLwOnmyuj-C-RPxRE1o-Glw/exec";[cite: 3]

        function switchTab(evt, tipo) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));

            evt.currentTarget.classList.add('active');
            document.getElementById('form-' + tipo).classList.add('active');
            document.getElementById('mensaje').innerText = '';
        }

        function enviarFormulario(event, tipo) {
            event.preventDefault();
            const form = document.getElementById('form-' + tipo);
            const formData = new FormData(form);
            const data = { tipo: tipo };

            formData.forEach((value, key) => {
                data[key] = value;
            });

            const msgDiv = document.getElementById('mensaje');
            msgDiv.style.color = '#3498db';
            msgDiv.innerText = 'Guardando en Google Sheets...';

            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(() => {
                msgDiv.style.color = '#2ecc71';
                msgDiv.innerText = '¡Guardado correctamente en la hoja!';
                form.reset();
            })
            .catch(error => {
                console.error('Error:', error);
                msgDiv.style.color = '#e74c3c';
                msgDiv.innerText = 'Hubo un error al guardar.';
            });
        }
    </script>
</body>
</html>
