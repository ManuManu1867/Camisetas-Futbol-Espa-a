<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Tienda</title>
    <style>
        :root {
            --primary: #111827;
            --accent: #2563eb;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 8px;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }

        .container { max-width: 800px; margin: 0 auto; background: var(--surface); padding: 30px; border-radius: var(--radius); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        h1 { font-size: 1.5rem; margin-bottom: 20px; font-weight: 800; color: var(--primary); }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        
        small { display: block; color: var(--text-muted); margin-top: 5px; font-size: 0.8rem; }

        .btn {
            background-color: var(--primary); color: white; border: none;
            padding: 12px 20px; border-radius: var(--radius); font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: background 0.2s; width: 100%;
        }
        .btn:hover { background-color: #374151; }
        .btn-success { background-color: var(--success); margin-top: 10px; }
        .btn-success:hover { background-color: #059669; }

        .mensaje { margin-top: 15px; padding: 12px; border-radius: var(--radius); text-align: center; font-weight: 600; display: none; }
        .mensaje.exito { background-color: #d1fae5; color: #065f46; display: block; }
        .mensaje.error { background-color: #fee2e2; color: #991b1b; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Panel de Administración (Google Cloud)</h1>
        
        <form id="productForm" onsubmit="guardarProducto(event)">
            <div class="form-group">
                <label for="titulo">Título del Producto</label>
                <input type="text" id="titulo" required placeholder="Ej: España 1ª Equipación 2026">
            </div>

            <div class="form-group">
                <label for="categoria">Categoría</label>
                <select id="categoria" required>
                    <option value="Selecciones">Selecciones</option>
                    <option value="Clubes">Clubes</option>
                    <option value="Retro">Retro</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>

            <div class="form-group">
                <label for="precio">Precio (€)</label>
                <input type="number" step="0.01" id="precio" required placeholder="25.00">
            </div>

            <div class="form-group">
                <label for="talla">Tallas Disponibles</label>
                <input type="text" id="talla" required placeholder="XS, S, M, L, XL">
            </div>

            <div class="form-group">
                <label for="imagenes">Enlaces de Google Drive (Sepáralos con comas si son varios)</label>
                <textarea id="imagenes" rows="4" required placeholder="https://drive.google.com/file/d/.../view?usp=sharing, https://drive.google.com/..."></textarea>
                <small>Pega los enlaces compartidos de Google Drive de tus fotos. Si hay varios, pon una coma entre ellos.</small>
            </div>

            <button type="submit" class="btn" id="btnGuardar">🚀 Lanzar a Tienda (Guardar en Google Sheet)</button>
        </form>

        <div id="mensajeEstado" class="mensaje"></div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxGW9FSTwk-n_kKSpuglJjEVAps2DJ7tEeoZrW823KUXTukMbNUtA3GunYn9OaTtDCcnw/exec';

        // Función auxiliar para transformar automáticamente cualquier enlace de Drive al formato de imagen directa
        function transformarEnlaceDrive(urlOriginal) {
            let urlLimpia = urlOriginal.trim();
            let id = '';
            
            if (urlLimpia.includes('/d/')) {
                let match = urlLimpia.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) id = match[1];
            } else if (urlLimpia.includes('id=')) {
                let match = urlLimpia.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) id = match[1];
            }

            if (id) {
                return `https://lh3.googleusercontent.com/d/${id}`;
            }
            return urlLimpia;
        }

        async function guardarProducto(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btnGuardar');
            const mensaje = document.getElementById('mensajeEstado');
            btn.disabled = true;
            btn.innerText = "Guardando en la nube...";
            mensaje.className = "mensaje";

            // Procesar las imágenes introducidas (separadas por comas) y transformarlas a enlaces directos de Google
            const inputImgs = document.getElementById('imagenes').value;
            const arrayRaw = inputImgs.split(',');
            const arrayTransformado = arrayRaw.map(img => transformarEnlaceDrive(img));
            const imagenesFinalesStr = arrayTransformado.join(',');

            const nuevoProducto = {
                id: new Date().getTime(),
                titulo: document.getElementById('titulo').value,
                categoria: document.getElementById('categoria').value,
                precio: document.getElementById('precio').value,
                talla: document.getElementById('talla').value,
                imagenes: imagenesFinalesStr
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Necesario para Google Apps Script
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(nuevoProducto)
                });

                mensaje.innerText = "¡Producto lanzado a la tienda con éxito! Ya se ve en el móvil.";
                mensaje.className = "mensaje exito";
                document.getElementById('productForm').reset();
            } catch (error) {
                console.error("Error:", error);
                mensaje.innerText = "Error al guardar el producto. Inténtalo de nuevo.";
                mensaje.className = "mensaje error";
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 Lanzar a Tienda (Guardar en Google Sheet)";
            }
        }
    </script>
</body>
</html>
