<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Tienda de Camisetas</title>
    <style>
        :root {
            --primary: #111827;
            --accent: #2563eb;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 8px;
            --success: #16a34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .admin-card {
            background: var(--surface); width: 100%; max-width: 500px;
            padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
        }

        h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; text-align: center; color: var(--primary); }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border);
            border-radius: 6px; font-size: 0.95rem; outline: none; background: #fff;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent); }

        .btn-guardar {
            background: var(--success); color: white; border: none; width: 100%; padding: 12px;
            border-radius: var(--radius); font-weight: 700; font-size: 1rem; cursor: pointer; 
            text-align: center; margin-top: 10px; transition: background 0.2s;
        }
        .btn-guardar:hover { background: #15803d; }

        .link-volver { display: block; text-align: center; margin-top: 20px; color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        .link-volver:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h1>Panel de Administración</h1>
        <form onsubmit="guardarNuevoProducto(event)">
            <div class="form-group">
                <label>Título de la Camiseta:</label>
                <input type="text" id="adminTitulo" required placeholder="Ej: Argentina 1ª Equipación 2026">
            </div>
            <div class="form-group">
                <label>Categoría:</label>
                <select id="adminCategoria" required>
                    <option value="Selecciones">Selecciones</option>
                    <option value="Clubes">Clubes</option>
                    <option value="Retro">Retro</option>
                </select>
            </div>
            <div class="form-group">
                <label>Precio (€):</label>
                <input type="number" step="0.01" id="adminPrecio" required placeholder="24.99">
            </div>
            <div class="form-group">
                <label>Tallas (separadas por comas):</label>
                <input type="text" id="adminTalla" value="XS, S, M, L, XL" required>
            </div>
            <div class="form-group">
                <label>Enlace de la Imagen (Google Drive o URL):</label>
                <input type="text" id="adminImagen" required placeholder="https://...">
            </div>
            <button type="submit" class="btn-guardar" id="btnGuardarAdmin">Añadir Camiseta a Google Sheets</button>
        </form>
        <a href="index.html" class="link-volver">← Ver la tienda de clientes</a>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzFQoJGaik-xdHVm0CBBvnVGKVJt7bVyPuFNFVeXnC8iT-9plM8nRrabr1rXqdABBBv8g/exec';

        async function guardarNuevoProducto(event) {
            event.preventDefault();
            const btn = document.getElementById('btnGuardarAdmin');
            btn.innerText = "Guardando...";
            btn.disabled = true;

            let nuevoProducto = {
                titulo: document.getElementById('adminTitulo').value,
                categoria: document.getElementById('adminCategoria').value,
                precio: document.getElementById('adminPrecio').value,
                talla: document.getElementById('adminTalla').value,
                imagenes: document.getElementById('adminImagen').value
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoProducto)
                });

                alert("¡Camiseta añadida correctamente a Google Sheets!");
                document.getElementById('adminTitulo').value = '';
                document.getElementById('adminPrecio').value = '';
                document.getElementById('adminImagen').value = '';
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Hubo un error al guardar.");
            } finally {
                btn.innerText = "Añadir Camiseta a Google Sheets";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
