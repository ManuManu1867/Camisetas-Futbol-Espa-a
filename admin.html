<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 p-6 transition-colors duration-300">

    <div class="max-w-4xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
        <h1 class="text-2xl font-bold mb-6">Panel de Administración - Google Sheets API</h1>

        <!-- Selector de Modo: Producto (Camiseta) o Parche -->
        <div class="flex gap-4 mb-6">
            <button type="button" onclick="switchMode('product')" id="btn-mode-product" class="px-4 py-2 bg-blue-600 text-white rounded font-semibold transition">Agregar Camiseta</button>
            <button type="button" onclick="switchMode('patch')" id="btn-mode-patch" class="px-4 py-2 bg-gray-300 dark:bg-gray-700 rounded font-semibold transition">Agregar Parche</button>
        </div>

        <form id="admin-form" onsubmit="submitForm(event)">
            <!-- Campos dinámicos según el modo -->
            <div id="form-fields" class="space-y-4">
                <!-- Se inyecta mediante JS -->
            </div>

            <!-- Live Preview Component -->
            <div class="mt-6 p-4 border rounded-lg bg-gray-50 dark:bg-gray-700">
                <h3 class="text-sm font-bold uppercase tracking-wide mb-2 text-gray-500 dark:text-gray-300">Vista Previa en Vivo</h3>
                <div id="live-preview" class="p-3 bg-white dark:bg-gray-800 rounded border dark:border-gray-600">
                    <!-- Tarjeta de vista previa -->
                </div>
            </div>

            <button type="submit" class="mt-6 w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-bold transition">Enviar a Google Sheets</button>
        </form>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz9DbS7_o1No0_mgs-PKeE6vhanGG4whu4EuvfltEmL-BhEs1O03EUNUX9ZtmT2q3mF0w/exec";[cite: 4]
        let currentMode = 'product';

        function switchMode(mode) {
            currentMode = mode;
            const container = document.getElementById('form-fields');
            const btnProd = document.getElementById('btn-mode-product');
            const btnPatch = document.getElementById('btn-mode-patch');

            if (mode === 'product') {
                btnProd.className = "px-4 py-2 bg-blue-600 text-white rounded font-semibold transition";
                btnPatch.className = "px-4 py-2 bg-gray-300 dark:bg-gray-700 rounded font-semibold transition";
                
                // Formulario de Camisetas con la columna de IDs de parches permitidos
                container.innerHTML = `
                    <div>
                        <label class="block text-sm font-medium mb-1">Nombre de la Camiseta:</label>
                        <input type="text" id="p-name" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600" oninput="updatePreview()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Precio:</label>
                        <input type="number" id="p-price" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600" oninput="updatePreview()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">IDs de Parches Permitidos (separados por comas, ej: P01,P03):</label>
                        <input type="text" id="p-allowed-patches" placeholder="Ej: P01, P05" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600" oninput="updatePreview()">
                    </div>
                `;
            } else {
                btnPatch.className = "px-4 py-2 bg-blue-600 text-white rounded font-semibold transition";
                btnProd.className = "px-4 py-2 bg-gray-300 dark:bg-gray-700 rounded font-semibold transition";
                
                // Formulario de Parches SIN la columna categoría
                container.innerHTML = `
                    <div>
                        <label class="block text-sm font-medium mb-1">ID del Parche:</label>
                        <input type="text" id="patch-id" required placeholder="Ej: P01" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600" oninput="updatePreview()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Nombre del Parche:</label>
                        <input type="text" id="patch-name" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600" oninput="updatePreview()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Precio del Parche:</label>
                        <input type="number" id="patch-price" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600" oninput="updatePreview()">
                    </div>
                `;
            }
            updatePreview();
        }

        function updatePreview() {
            const preview = document.getElementById('live-preview');
            if (currentMode === 'product') {
                const name = document.getElementById('p-name').value || 'Nombre de la Camiseta';
                const price = document.getElementById('p-price').value || '0';
                const patches = document.getElementById('p-allowed-patches').value || 'Ninguno';
                preview.innerHTML = `
                    <h4 class="font-bold text-lg">${name}</h4>
                    <p class="text-green-600 dark:text-green-400 font-semibold">Precio: $${price}</p>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Parches permitidos (IDs): <strong>${patches}</strong></p>
                `;
            } else {
                const id = document.getElementById('patch-id').value || 'ID';
                const name = document.getElementById('patch-name').value || 'Nombre del Parche';
                const price = document.getElementById('patch-price').value || '0';
                preview.innerHTML = `
                    <h4 class="font-bold text-lg">[Parche: ${id}] ${name}</h4>
                    <p class="text-green-600 dark:text-green-400 font-semibold">Precio: $${price}</p>
                `;
            }
        }

        function submitForm(event) {
            event.preventDefault();
            let payload = { mode: currentMode };

            if (currentMode === 'product') {
                payload.name = document.getElementById('p-name').value;
                payload.price = document.getElementById('p-price').value;
                payload.allowedPatches = document.getElementById('p-allowed-patches').value;
            } else {
                payload.patchId = document.getElementById('patch-id').value;
                payload.name = document.getElementById('patch-name').value;
                payload.price = document.getElementById('patch-price').value;
            }

            // Envío por POST (no-cors) a Google Sheets API[cite: 4]
            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                alert('¡Datos enviados correctamente a Google Sheets!');
                document.getElementById('admin-form').reset();
                updatePreview();
            }).catch(err => {
                console.error(err);
                alert('Hubo un error al enviar los datos.');
            });
        }

        // Inicializar el formulario por defecto en modo producto
        switchMode('product');
    </script>
</body>
</html>
